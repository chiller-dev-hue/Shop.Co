<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SHOP.CO</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-white text-black">

    <!-- HEADER -->
    <header class="border-b border-gray-100">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">

            <!-- Logo -->
            <a
                href="./index.html"
                class="text-2xl font-bold tracking-tight">
                SHOP.CO
            </a>

            <!-- Continue Shopping -->
            <a
                href="./index.html"
                class="text-sm font-medium underline">
                Continue Shopping
            </a>
        </div>
    </header>

    <!-- CART -->
    <main class="mx-auto max-w-7xl px-5 py-10">

        <!-- Page Title -->
        <h1 class="text-3xl font-bold">
            Your Cart
        </h1>

        <!-- CART CONTENT -->
        <div class="mt-8 grid gap-8 lg:grid-cols-[1fr_380px]">

            <!-- CART ITEMS -->
            <section>
                <div
                    id="cart-items"
                    class="rounded-2xl border border-gray-200 px-5">
                </div>
            </section>

            <!-- ORDER SUMMARY -->
            <aside
                class="h-fit rounded-2xl border border-gray-200 p-6">
                <h2 class="text-xl font-bold">
                    Order Summary
                </h2>

                <!-- Subtotal -->
                <div class="mt-6 flex items-center justify-between">
                    <p class="text-gray-500">
                        Subtotal
                    </p>
                    <p
                        id="cart-subtotal"
                        class="font-semibold">
                        $0
                    </p>
                </div>

                <!-- Discount -->
                <div class="mt-4 flex items-center justify-between">
                    <p class="text-gray-500">
                        Discount
                    </p>
                    <p
                        id="cart-discount"
                        class="font-semibold text-red-500">
                        -$0
                    </p>
                </div>

                <!-- Delivery Fee -->
                <div class="mt-4 flex items-center justify-between">
                    <p class="text-gray-500">
                        Delivery Fee
                    </p>
                    <p
                        id="delivery-fee"
                        class="font-semibold">
                        $0
                    </p>
                </div>

                <!-- Divider -->
                <div class="my-6 border-t border-gray-200"></div>

                <!-- Total -->
                <div class="flex items-center justify-between">
                    <p class="text-lg font-medium">
                        Total
                    </p>
                    <p
                        id="cart-total"
                        class="text-xl font-bold">
                        $0
                    </p>
                </div>

                <!-- Checkout Button -->
                <button
                    id="checkout-button"
                    type="button"
                    class="mt-6 flex w-full items-center justify-center rounded-full bg-black px-6 py-4 text-sm font-medium text-white transition hover:bg-gray-800">
                    Go to Checkout
                </button>

                <!-- Continue Shopping -->
                <a
                    href="./index.html"
                    class="mt-3 flex w-full items-center justify-center rounded-full border border-black px-6 py-4 text-sm font-medium transition hover:bg-black hover:text-white">
                    Continue Shopping
                </a>
            </aside>
        </div>
    </main>


    <!-- JAVASCRIPT -->
    <script src="./script.js"></script>

</body>
</html>
